      <script type="text/discourse-plugin" version="0.8" nonce="sycOKbFsHDgA1m8iYPkPjzRXQ">
  const HIDDEN_CATEGORY_IDS = [23, 24, 25, 26];
  const TARGET_GROUPS = ['trust_level_0']; // Add your group names here

  api.onPageChange(() => {
    const currentUser = api.getCurrentUser();
    if (!currentUser) return;

    const inTargetGroup = currentUser.groups.some(g => TARGET_GROUPS.includes(g.name));
    if (!inTargetGroup) return;

    // Only run inside new topic composer
    const composer = document.querySelector('.composer.new-topic');
    if (!composer) return;

    const interval = setInterval(() => {
      HIDDEN_CATEGORY_IDS.forEach(id => {
        const row = document.querySelector(`.composer.new-topic .select-kit-row[data-value="${id}"]`);
        if (row) row.style.display = 'none';
      });
    }, 300);

    // Clear once loaded
    setTimeout(() => clearInterval(interval), 5000);
  });
